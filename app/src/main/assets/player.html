<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#video{width:100%;height:100%;object-fit:contain;background:#000}
#status{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:14px;text-shadow:0 1px 4px #000;padding:8px}
#sound{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:8px;padding:14px 20px;background:#222;color:#fff;font-size:16px;display:none}
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="status">Подключение к Ivideon…</div>
<button id="sound">Включить звук</button>
<script>
(() => {
 const video=document.getElementById('video'), status=document.getElementById('status'), sound=document.getElementById('sound');
 let socket=null, mediaSource=null, sourceBuffer=null, queue=[], codecs=[], sourceOpen=false, stopped=true, session=0, objectUrl=null, appendCount=0, lastChunkInfo='нет', streamInitInfo='не получен';
 function say(s){status.textContent=s;}
 function inspectMp4(data){
   try{
     const v=new DataView(data), out=[]; let p=0;
     while(p+8<=data.byteLength && out.length<8){
       let size=v.getUint32(p), type=String.fromCharCode(v.getUint8(p+4),v.getUint8(p+5),v.getUint8(p+6),v.getUint8(p+7));
       let header=8; if(size===1){if(p+16>data.byteLength)break; size=Number(v.getBigUint64(p+8));header=16;} else if(size===0)size=data.byteLength-p;
       out.push(type+':'+size); if(size<header || p+size>data.byteLength)break; p+=size;
     }
     return data.byteLength+' bytes ['+out.join(', ')+']';
   }catch(e){return data.byteLength+' bytes [не удалось разобрать MP4]';}
 }
 function isCurrent(id, ws, ms){
   return id===session && !stopped && ws===socket && ms===mediaSource;
 }
 function hasBuffer(ms, sb){
   if(!ms || !sb || ms.readyState!=='open') return false;
   for(let i=0;i<ms.sourceBuffers.length;i++) if(ms.sourceBuffers[i]===sb) return true;
   return false;
 }
 function setupSource(id, ws, ms){
   if(!isCurrent(id,ws,ms) || sourceBuffer || !sourceOpen ||
      !codecs.some(c=>c.startsWith('avc1')||c.startsWith('avc3')) ||
      !codecs.some(c=>c.startsWith('mp4a'))) return;
   const mime='video/mp4; codecs="'+codecs.join(',')+'"';
   if(!MediaSource.isTypeSupported(mime)){say('Формат потока не поддерживается: '+mime);return;}
   try{
     const sb=ms.addSourceBuffer(mime);
     if(!isCurrent(id,ws,ms)){try{ms.removeSourceBuffer(sb);}catch(e){}return;}
     sourceBuffer=sb;
     sb.mode='segments';
     sb.addEventListener('updateend',()=>{if(isCurrent(id,ws,ms)&&sourceBuffer===sb)drain(id,ws,ms,sb);});
     sb.addEventListener('error',()=>{if(isCurrent(id,ws,ms)&&sourceBuffer===sb)say('SourceBuffer error; codec='+codecs.join(',')+'; chunk#'+appendCount+' '+lastChunkInfo+'; queued='+queue.length);});
     drain(id,ws,ms,sb);
   }catch(e){if(isCurrent(id,ws,ms))say('Ошибка видеодекодера: '+e.message);}
 }
 function drain(id,ws,ms,sb){
   if(!isCurrent(id,ws,ms) || sourceBuffer!==sb || !hasBuffer(ms,sb) || sb.updating || queue.length===0) return;
   const chunk=queue.shift(); appendCount++; lastChunkInfo=inspectMp4(chunk);
   try{sb.appendBuffer(chunk);}
   catch(e){
     if(!isCurrent(id,ws,ms) || sourceBuffer!==sb || !hasBuffer(ms,sb)) return;
     say('appendBuffer: '+e.name+': '+e.message+'; chunk#'+appendCount+' '+lastChunkInfo);
   }
 }
 function start(url){
   // Invalidate the previous connection before closing it: its late events must be ignored.
   stopped=true; session++;
   const oldSocket=socket, oldSource=mediaSource, oldUrl=objectUrl;
   socket=null; mediaSource=null; sourceBuffer=null; queue=[]; codecs=[]; sourceOpen=false;
   if(oldSocket){try{oldSocket.close();}catch(e){}}
   if(oldSource && oldSource.readyState==='open'){try{oldSource.endOfStream();}catch(e){}}
   if(oldUrl){try{URL.revokeObjectURL(oldUrl);}catch(e){}}
   stopped=false; appendCount=0; lastChunkInfo='нет'; streamInitInfo='не получен';
   const id=session, ms=new MediaSource();
   mediaSource=ms;
   objectUrl=URL.createObjectURL(ms);
   video.src=objectUrl;
   ms.addEventListener('sourceopen',()=>{
     if(id!==session || stopped || mediaSource!==ms) return;
     sourceOpen=true; setupSource(id,socket,ms);
   });
   let ws;
   try{ws=new WebSocket(url);ws.binaryType='arraybuffer';socket=ws;}
   catch(e){if(id===session){say('Не удалось открыть поток: '+e.message);stopped=true;}return;}
   ws.onopen=()=>{if(isCurrent(id,ws,ms))say('Поток подключён. Получаю видео и звук…');};
   ws.onmessage=(event)=>{
     if(!isCurrent(id,ws,ms)) return;
     if(typeof event.data==='string'){
       let m;try{m=JSON.parse(event.data);}catch(e){return;}
       if(m.type==='stream-init'){
         const codec=m.codec_string||m.codec||'';
         // Keep only the init message structure; never display URLs or credentials.
         const safeInit={}; Object.keys(m).forEach(k=>{if(!/token|auth|url|key|secret/i.test(k))safeInit[k]=m[k];});
         streamInitInfo=JSON.stringify(safeInit).slice(0,1800);
         if(codec && !codecs.includes(codec))codecs.push(codec);
         setupSource(id,ws,ms);
       }else if(m.type==='error'){
         say('Ошибка Ivideon: '+(m.value||m.message||'поток недоступен'));
       }else if(m.type==='metadata' && !sourceBuffer){
         setupSource(id,ws,ms);
       }
     }else if(event.data instanceof ArrayBuffer){
       if(!isCurrent(id,ws,ms))return;
       queue.push(event.data);setupSource(id,ws,ms);
       if(sourceBuffer)drain(id,ws,ms,sourceBuffer);
       if(video.paused)video.play().catch(()=>{if(isCurrent(id,ws,ms))sound.style.display='block';});
     }
   };
   ws.onerror=()=>{if(isCurrent(id,ws,ms))say('Ошибка WebSocket-подключения');};
   ws.onclose=()=>{
     if(isCurrent(id,ws,ms)){
       stopped=true;say('Поток отключён. Переподключение…');
       if(window.Android&&Android.onStreamClosed)Android.onStreamClosed();
     }
   };
 }
 sound.addEventListener('click',()=>{
   video.muted=false;
   video.play().then(()=>{sound.style.display='none';})
     .catch(e=>{
       const media=video.error ? ' mediaError='+video.error.code+(video.error.message?' '+video.error.message:'') : '';
       const details='Воспроизведение: '+(e.name||'Error')+': '+(e.message||'без подробностей')+
         '; readyState='+video.readyState+'; networkState='+video.networkState+
         '; MediaSource='+(mediaSource?mediaSource.readyState:'нет')+
         '; SourceBuffer='+(sourceBuffer?'есть':'нет')+media;
       say(details);
       sound.textContent='Повторить';
       sound.style.display='block';
     });
 });
 video.addEventListener('error',()=>{
   const e=video.error;
   say('Ошибка видео: '+(e?('код '+e.code+' '+(e.message||'')):'неизвестно')+
     '; readyState='+video.readyState+'; networkState='+video.networkState+
     '; codecs='+codecs.join(',')+'; stream-init='+streamInitInfo+'; chunks='+appendCount+'; lastChunk='+lastChunkInfo+'; queued='+queue.length);
 });
 video.addEventListener('playing',()=>{say('');sound.style.display='none';});
 video.addEventListener('waiting',()=>{if(!sourceBuffer)say('Ожидание видеопотока…');});
 window.startIvideonStream=start;
 window.stopIvideonStream=()=>{
   stopped=true;session++;
   const ws=socket, ms=mediaSource, url=objectUrl;
   socket=null;mediaSource=null;sourceBuffer=null;queue=[];codecs=[];sourceOpen=false;objectUrl=null;
   if(ws){try{ws.close();}catch(e){}}
   if(ms&&ms.readyState==='open'){try{ms.endOfStream();}catch(e){}}
   if(url){try{URL.revokeObjectURL(url);}catch(e){}}
 };
})();
</script>
</body>
</html>
