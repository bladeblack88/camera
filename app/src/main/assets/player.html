<body>
<video id="video" autoplay playsinline></video>
<div id="status">Подключение к Ivideon…</div>
<div id="codecs"></div>
<button id="native">Тест MediaCodec</button>

<script>
(() => {
 const nativeButton=document.getElementById('native');
 nativeButton.addEventListener('click',()=>{if(window.Android&&Android.openNativePlayer)Android.openNativePlayer();});
 const video=document.getElementById('video'), status=document.getElementById('status'), sound=document.getElementById('sound'), codecPanel=document.getElementById('codecs');
 let socket=null, mediaSource=null, sourceBuffer=null, queue=[], history=[], codecs=[], sourceOpen=false, stopped=true, session=0, objectUrl=null, appendCount=0, lastChunkInfo='нет', initChunkInfo='нет', firstMediaChunkInfo='нет', streamInitInfo='не получен', initSegment=null, initQueued=false, fragmentTrackId=null, trackFixInfo='не проверено', selectedCodec='auto', activeMime='не создан';
 function say(s){status.textContent=s;}
 function inspectMp4(data){
   try{
     const v=new DataView(data), bytes=new Uint8Array(data), boxes=[];
     const u32=(p)=>v.getUint32(p), i32=(p)=>v.getInt32(p);
     function walk(start,end,depth){
       let p=start, out=[];
       while(p+8<=end && out.length<32){
         let size=u32(p), type=String.fromCharCode(bytes[p+4],bytes[p+5],bytes[p+6],bytes[p+7]), h=8;
         if(size===1){if(p+16>end)break;size=u32(p+8)*4294967296+u32(p+12);h=16;}else if(size===0)size=end-p;
         if(size<h||p+size>end){out.push(type+':BAD('+size+')');break;}
         let detail='';
         if(type==='mfhd'&&size>=16)detail=' seq='+u32(p+12);
         if(type==='tfhd'&&size>=16)detail=' track='+u32(p+12)+' flags=0x'+(u32(p+8)&0xffffff).toString(16);
         if(type==='tfdt'&&size>=16){const ver=bytes[p+8];detail=' decodeTime='+(ver===1&&size>=20?u32(p+12)*4294967296+u32(p+16):u32(p+12));}
         if(type==='trun'&&size>=16){
           const ver=bytes[p+8], flags=u32(p+8)&0xffffff, count=u32(p+12);let q=p+16, dataOffset=null, firstFlags=null, sizes=[], durations=[];
           if(flags&1){if(q+4<=p+size){dataOffset=i32(q);q+=4;}}
           if(flags&4){if(q+4<=p+size){firstFlags=u32(q);q+=4;}}
           for(let n=0;n<count&&n<10000;n++){
             if(flags&0x100){if(q+4>p+size)break;durations.push(u32(q));q+=4;}
             if(flags&0x200){if(q+4>p+size)break;sizes.push(u32(q));q+=4;}
             if(flags&0x400){if(q+4>p+size)break;q+=4;}
             if(flags&0x800){if(q+4>p+size)break;q+=4;}
           }
           const sum=sizes.reduce((a,b)=>a+b,0);
           detail=' samples='+count+' flags=0x'+flags.toString(16)+' dataOffset='+dataOffset+' sampleSizes='+sizes.length+'/'+count+' sum='+sum+' firstSizes='+sizes.slice(0,8).join(',')+' firstDur='+durations.slice(0,4).join(',');
           boxes.push({type:'trun',dataOffset,sizes,sum,count,version:ver});
         }
         out.push(type+':'+size+detail);
         if(['moof','traf'].includes(type))out[out.length-1]+='{'+walk(p+h,p+size,depth+1).join(',')+'}';
         if(type==='mdat')boxes.push({type:'mdat',start:p+h,end:p+size,size:size-h});
         if(type==='avcC'&&size>=h+5){const z=p+h;boxes.push({type:'avcC',lengthSize:(bytes[z+4]&3)+1,profile:bytes[z+1],compat:bytes[z+2],level:bytes[z+3]});}
         p+=size;
       }
       return out;
     }
     const summary=walk(0,data.byteLength,0);
     let extra='';
     const tr=boxes.find(x=>x.type==='trun'), md=boxes.find(x=>x.type==='mdat'), av=boxes.find(x=>x.type==='avcC');
     if(tr&&md&&tr.sizes.length){
       let offset=tr.dataOffset===null?md.start:tr.dataOffset;
       // If trun sizes exactly cover mdat, that is the authoritative sample start.
       const relative=(tr.sum===md.size)?md.start:(offset>=0&&offset<data.byteLength?offset:md.start);
       let pos=relative, samples=[];
       for(let n=0;n<Math.min(5,tr.sizes.length);n++){
         const sz=tr.sizes[n], end=pos+sz, nal=[];
         if(end>data.byteLength||sz<1){samples.push('#'+(n+1)+':BAD size='+sz+' pos='+pos);break;}
         let q=pos, lenSize=av?av.lengthSize:4, valid=true;
         while(q+lenSize<=end&&nal.length<8){
           let len=0;for(let k=0;k<lenSize;k++)len=len*256+bytes[q+k];q+=lenSize;
           if(len<1||q+len>end){valid=false;nal.push('BADlen='+len);break;}
           nal.push('len='+len+'/type='+(bytes[q]&31));q+=len;
         }
         const preview=Array.from(bytes.slice(pos,Math.min(end,pos+Math.min(sz,32)))).map(x=>x.toString(16).padStart(2,'0')).join(''); samples.push('#'+(n+1)+':size='+sz+' hex='+preview+' nal='+nal.join('|')+' parse='+(valid?'ok':'bad'));
         pos=end;
       }
       extra='; sampleCheck='+samples.join(';')+'; mdatPayload='+md.size+'; trunSum='+tr.sum+'; sampleEnd='+pos+'; lengthSize='+(av?av.lengthSize:'default4');
     }
     return data.byteLength+' bytes ['+summary.join(', ')+']'+extra;
   }catch(e){return data.byteLength+' bytes [MP4 inspect error: '+e.message+']';}
 }
 function readFragmentTrackId(data){
   try{const v=new DataView(data);let p=0;while(p+8<=data.byteLength){let n=v.getUint32(p),t=String.fromCharCode(v.getUint8(p+4),v.getUint8(p+5),v.getUint8(p+6),v.getUint8(p+7));if(n<8||p+n>data.byteLength)break;if(t==='moof'){let q=p+8;while(q+8<=p+n){let z=v.getUint32(q),u=String.fromCharCode(v.getUint8(q+4),v.getUint8(q+5),v.getUint8(q+6),v.getUint8(q+7));if(z<8||q+z>p+n)break;if(u==='traf'){let a=q+8;while(a+8<=q+z){let b=v.getUint32(a),w=String.fromCharCode(v.getUint8(a+4),v.getUint8(a+5),v.getUint8(a+6),v.getUint8(a+7));if(b<8||a+b>q+z)break;if(w==='tfhd'&&b>=16)return v.getUint32(a+12);a+=b;}}q+=z;}}p+=n;}}catch(e){}return null;
 }
 function normalizeFragmentSamples(data){
   // Ivideon sends raw AVC NAL units as trun samples. ISO BMFF/avc1
   // requires each NAL to be prefixed by the length field declared in avcC.
   // Add a 4-byte big-endian length to every sample and update trun/mdat sizes.
   try{
     const src=new Uint8Array(data), view=new DataView(data);
     let moof=-1, moofSize=0, mdat=-1, mdatSize=0, mdatHeader=8, trun=-1, trunSize=0;
     for(let p=0;p+8<=src.length;){
       let n=view.getUint32(p), t=String.fromCharCode(src[p+4],src[p+5],src[p+6],src[p+7]), h=8;
       if(n===1){if(p+16>src.length)return data;n=view.getUint32(p+8)*4294967296+view.getUint32(p+12);h=16;}
       else if(n===0)n=src.length-p;
       if(n<h||p+n>src.length)return data;
       if(t==='moof'){moof=p;moofSize=n;}
       if(t==='mdat'){mdat=p;mdatSize=n;mdatHeader=h;}
       p+=n;
     }
     if(moof<0||mdat<0||mdat<=moof||mdatHeader!==8||mdatSize>0xffffffff-1024)return data;
     for(let p=moof+8;p+8<=moof+moofSize;){
       let n=view.getUint32(p),t=String.fromCharCode(src[p+4],src[p+5],src[p+6],src[p+7]);
       if(n<8||p+n>moof+moofSize)break;
       if(t==='traf'){
         for(let q=p+8;q+8<=p+n;){
           let z=view.getUint32(q),u=String.fromCharCode(src[q+4],src[q+5],src[q+6],src[q+7]);
           if(z<8||q+z>p+n)break;
           if(u==='trun'){if(trun>=0)return data;trun=q;trunSize=z;}
           q+=z;
         }
       }
       p+=n;
     }
     if(trun<0)return data;
     const flags=view.getUint32(trun+8)&0xffffff, count=view.getUint32(trun+12);
     let q=trun+16, dataOffsetPos=-1;
     if(flags&1){dataOffsetPos=q;q+=4;}
     if(flags&4)q+=4;
     const sizePositions=[], sizes=[];
     for(let i=0;i<count;i++){
       if(flags&0x100)q+=4;
       if(flags&0x200){
         if(q+4>trun+trunSize)return data;
         sizePositions.push(q);sizes.push(view.getUint32(q));q+=4;
       } else return data;
       if(flags&0x400)q+=4;
       if(flags&0x800)q+=4;
       if(q>trun+trunSize)return data;
     }
     if(sizes.length!==count||count===0)return data;
     const payloadStart=mdat+mdatHeader, payloadEnd=mdat+mdatSize;
     const total=sizes.reduce((a,b)=>a+b,0);
     if(total!==payloadEnd-payloadStart)return data;
     // Already length-prefixed? Leave it untouched.
     const firstLen=sizes[0]>=4?((src[payloadStart]*0x1000000)+(src[payloadStart+1]<<16)+(src[payloadStart+2]<<8)+src[payloadStart+3]):-1;
     if(firstLen===sizes[0]-4)return data;
     // Validate the first byte of every raw AVC NAL header before rewriting.
     let pos=payloadStart;
     for(let i=0;i<count;i++){
       if(sizes[i]<1||pos+sizes[i]>payloadEnd)return data;
       const nalType=src[pos]&31;
       if(nalType<1||nalType>23)return data;
       pos+=sizes[i];
     }
     const extra=count*4, out=new Uint8Array(src.length+extra);
     // Copy everything through the mdat header; sample payload is rebuilt below.
     out.set(src.subarray(0,payloadStart),0);
     const outView=new DataView(out.buffer);
     let read=payloadStart, write=payloadStart;
     for(let i=0;i<count;i++){
       const n=sizes[i];
       outView.setUint32(write,n);write+=4;
       out.set(src.subarray(read,read+n),write);
       read+=n;write+=n;
       outView.setUint32(sizePositions[i],n+4);
     }
     // Update the mdat box size (the original box uses a 32-bit size).
     outView.setUint32(mdat,mdatSize+extra);
     // The data_offset is relative to moof and points to the unchanged mdat payload start.
     if(dataOffsetPos>=0)outView.setInt32(dataOffsetPos,(payloadStart)-moof);
     return out.buffer;
   }catch(e){return data;}
 }
 function codecFromInit(buffer){
   try{
     const bytes=new Uint8Array(buffer);
     for(let i=4;i+8<bytes.length;i++){
       if(bytes[i]===0x61&&bytes[i+1]===0x76&&bytes[i+2]===0x63&&bytes[i+3]===0x43){
         const profile=bytes[i+5],compat=bytes[i+6],level=bytes[i+7];
         return 'avc1.'+[profile,compat,level].map(x=>x.toString(16).padStart(2,'0')).join('');
       }
     }
   }catch(e){}
   return null;
 }
 function alignInitTrackId(buffer,targetId){
   const v=new DataView(buffer),found=[],containers=['moov','trak','mdia','minf','stbl','mvex','edts','dinf'];
   function walk(start,end){let p=start;while(p+8<=end){let n=v.getUint32(p),t=String.fromCharCode(v.getUint8(p+4),v.getUint8(p+5),v.getUint8(p+6),v.getUint8(p+7)),h=8;if(n===1){if(p+16>end)break;n=v.getUint32(p+8)*4294967296+v.getUint32(p+12);h=16;}else if(n===0)n=end-p;if(n<h||p+n>end)break;if(t==='tkhd'&&n>=24){const ver=v.getUint8(p+h),o=p+(ver===1?28:20);if(o+4<=p+n){found.push('tkhd:'+v.getUint32(o));v.setUint32(o,targetId);}}else if(t==='trex'&&n>=16){found.push('trex:'+v.getUint32(p+12));v.setUint32(p+12,targetId);}if(containers.includes(t))walk(p+h,p+n);p+=n;}}
   walk(0,buffer.byteLength);return found.join(',')+' => '+targetId;
 }
 function isCurrent(id, ws, ms){
   return id===session && !stopped && ws===socket && ms===mediaSource;
 }
 function hasBuffer(ms, sb){
   if(!ms || !sb || ms.readyState!=='open') return false;
   for(let i=0;i<ms.sourceBuffers.length;i++) if(ms.sourceBuffers[i]===sb) return true;
   return false;
 }
 function setupSource(id, ws, ms){
   if(!isCurrent(id,ws,ms) || sourceBuffer || !sourceOpen || !initSegment || fragmentTrackId===null) return;
   // The supplied Ivideon init segment currently describes a video (vide) track only.
   // The stream-init codec string can disagree with the actual avcC configuration.
   // MSE must be told the profile/compatibility/level declared by the init segment.
   const initCodec=codecFromInit(initSegment);
   const videoCodecs=selectedCodec==='auto'?(initCodec?[initCodec]:codecs.filter(c=>c.startsWith('avc1')||c.startsWith('avc3'))):[selectedCodec];
   if(!videoCodecs.length) return;
   const mime='video/mp4; codecs="'+videoCodecs.join(',')+'"'; activeMime=mime;
   if(!MediaSource.isTypeSupported(mime)){say('Формат потока не поддерживается: '+mime);return;}
   try{
     const sb=ms.addSourceBuffer(mime);
     if(!isCurrent(id,ws,ms)){try{ms.removeSourceBuffer(sb);}catch(e){}return;}
     sourceBuffer=sb;
     sb.mode='segments';
     if(!initQueued){queue.unshift(initSegment);initQueued=true;}
     sb.addEventListener('updateend',()=>{if(isCurrent(id,ws,ms)&&sourceBuffer===sb)drain(id,ws,ms,sb);});
     sb.addEventListener('error',()=>{if(isCurrent(id,ws,ms)&&sourceBuffer===sb)say('SourceBuffer error; codec='+codecs.join(',')+'; chunk#'+appendCount+' '+lastChunkInfo+'; queued='+queue.length);});
     drain(id,ws,ms,sb);
   }catch(e){if(isCurrent(id,ws,ms))say('Ошибка видеодекодера: '+e.message);}
 }
 function drain(id,ws,ms,sb){
   if(!isCurrent(id,ws,ms) || sourceBuffer!==sb || !hasBuffer(ms,sb) || sb.updating || queue.length===0) return;
   const chunk=queue.shift(); appendCount++; lastChunkInfo=inspectMp4(chunk); if(appendCount===1)initChunkInfo=lastChunkInfo; else if(appendCount===2)firstMediaChunkInfo=lastChunkInfo;
   try{sb.appendBuffer(chunk);}
   catch(e){
     if(!isCurrent(id,ws,ms) || sourceBuffer!==sb || !hasBuffer(ms,sb)) return;
     say('appendBuffer: '+e.name+': '+e.message+'; chunk#'+appendCount+' '+lastChunkInfo);
   }
 }
 function rebuildForCodec(codec){
   selectedCodec=codec;
   [...codecPanel.querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b.dataset.codec===codec));
   if(!initSegment||fragmentTrackId===null||!socket){say('Выбран '+(codec==='auto'?'Авто':codec)+'; ожидаю первый видеосегмент…');return;}
   const id=session, ws=socket, old=mediaSource, oldUrl=objectUrl;
   sourceBuffer=null;sourceOpen=false;initQueued=false;queue=history.slice();
   if(old&&old.readyState==='open'){try{old.endOfStream();}catch(e){}}
   if(oldUrl){try{URL.revokeObjectURL(oldUrl);}catch(e){}}
   const ms=new MediaSource();mediaSource=ms;objectUrl=URL.createObjectURL(ms);video.src=objectUrl;
   ms.addEventListener('sourceopen',()=>{if(isCurrent(id,ws,ms)){sourceOpen=true;setupSource(id,ws,ms);}});
   say('Проверяю кодек '+(codec==='auto'?'из avcC':codec)+'…');
 }
 const codecChoices=[['Авто','auto'],['H.264 High 2.2','avc1.640016'],['H.264 High 3.0','avc1.64001e'],['H.264 High 3.1','avc1.64001f'],['H.264 High 4.0','avc1.640028'],['H.264 High 4.1','avc1.640029'],['H.264 Main 3.0','avc1.4d001e'],['H.264 Main 3.1','avc1.4d001f'],['H.264 Main 4.0','avc1.4d0028'],['H.264 Main 4.1','avc1.4d0029'],['H.264 Baseline 3.0','avc1.42001e'],['H.264 Baseline 3.1','avc1.42001f']];
 codecChoices.forEach(([label,codec])=>{const b=document.createElement('button');b.textContent=label;b.dataset.codec=codec;b.addEventListener('click',()=>rebuildForCodec(codec));codecPanel.appendChild(b);});
 function start(url){
   // Invalidate the previous connection before closing it: its late events must be ignored.
   stopped=true; session++;
   const oldSocket=socket, oldSource=mediaSource, oldUrl=objectUrl;
   socket=null; mediaSource=null; sourceBuffer=null; queue=[]; codecs=[]; sourceOpen=false;
   if(oldSocket){try{oldSocket.close();}catch(e){}}
   if(oldSource && oldSource.readyState==='open'){try{oldSource.endOfStream();}catch(e){}}
   if(oldUrl){try{URL.revokeObjectURL(oldUrl);}catch(e){}}
   stopped=false; history=[]; appendCount=0; lastChunkInfo='нет'; initChunkInfo='нет'; firstMediaChunkInfo='нет'; streamInitInfo='не получен'; initSegment=null; initQueued=false;
   const id=session, ms=new MediaSource();
   mediaSource=ms;
   objectUrl=URL.createObjectURL(ms);
   video.src=objectUrl;
   ms.addEventListener('sourceopen',()=>{
     if(id!==session || stopped || mediaSource!==ms) return;
     sourceOpen=true; setupSource(id,socket,ms);
   });
   let ws;
   try{ws=new WebSocket(url);ws.binaryType='arraybuffer';socket=ws;}
   catch(e){if(id===session){say('Не удалось открыть поток: '+e.message);stopped=true;}return;}
   ws.onopen=()=>{if(isCurrent(id,ws,ms))say('Поток подключён. Получаю видео и звук…');};
   ws.onmessage=(event)=>{
     if(!isCurrent(id,ws,ms)) return;
     if(typeof event.data==='string'){
       let m;try{m=JSON.parse(event.data);}catch(e){return;}
       if(m.type==='stream-init'){
         const codec=m.codec_string||m.codec||'';
         // Keep only the init message structure; never display URLs or credentials.
         const safeInit={}; Object.keys(m).forEach(k=>{if(!/token|auth|url|key|secret/i.test(k))safeInit[k]=m[k];});
         streamInitInfo=JSON.stringify(safeInit).slice(0,1800);
         if(typeof m.data==='string' && m.data.length){
           try{
             const binary=atob(m.data), bytes=new Uint8Array(binary.length);
             for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
             initSegment=bytes.buffer;
           }catch(e){streamInitInfo+='; init-decode-error='+e.message;}
         }
         if(codec && !codecs.includes(codec))codecs.push(codec);
         // Wait for first media fragment to learn its tfhd track_ID.
       }else if(m.type==='error'){
         say('Ошибка Ivideon: '+(m.value||m.message||'поток недоступен'));
       }else if(m.type==='metadata' && !sourceBuffer){
         setupSource(id,ws,ms);
       }
     }else if(event.data instanceof ArrayBuffer){
       if(!isCurrent(id,ws,ms))return;
       if(fragmentTrackId===null){fragmentTrackId=readFragmentTrackId(event.data);if(fragmentTrackId!==null&&initSegment){try{trackFixInfo=alignInitTrackId(initSegment,fragmentTrackId);}catch(e){trackFixInfo='ошибка: '+e.message;}}}
       const normalized=normalizeFragmentSamples(event.data);
       history.push(normalized);if(history.length>12)history.shift();queue.push(normalized);setupSource(id,ws,ms);
       if(sourceBuffer)drain(id,ws,ms,sourceBuffer);
       if(video.paused)video.play().catch(()=>{if(isCurrent(id,ws,ms))sound.style.display='block';});
     }
   };
   ws.onerror=()=>{if(isCurrent(id,ws,ms))say('Ошибка WebSocket-подключения');};
   ws.onclose=()=>{
     if(isCurrent(id,ws,ms)){
       stopped=true;say('Поток отключён. Переподключение…');
       if(window.Android&&Android.onStreamClosed)Android.onStreamClosed();
     }
   };
 }
 sound.addEventListener('click',()=>{
   video.muted=false;
   video.play().then(()=>{sound.style.display='none';})
     .catch(e=>{
       const media=video.error ? ' mediaError='+video.error.code+(video.error.message?' '+video.error.message:'') : '';
       const details='Воспроизведение: '+(e.name||'Error')+': '+(e.message||'без подробностей')+
         '; readyState='+video.readyState+'; networkState='+video.networkState+
         '; MediaSource='+(mediaSource?mediaSource.readyState:'нет')+
         '; SourceBuffer='+(sourceBuffer?'есть':'нет')+media;
       say(details);
       sound.textContent='Повторить';
       sound.style.display='block';
     });
 });
 video.addEventListener('error',()=>{
   const e=video.error;
   say('Ошибка видео: '+(e?('код '+e.code+' '+(e.message||'')):'неизвестно')+
     '; readyState='+video.readyState+'; networkState='+video.networkState+
     '; codecs='+codecs.join(',')+'; selectedCodec='+selectedCodec+'; activeMime='+activeMime+'; stream-init='+streamInitInfo+'; trackFix='+trackFixInfo+'; fragmentTrackId='+fragmentTrackId+'; initChunk='+initChunkInfo+'; firstMediaChunk='+firstMediaChunkInfo+'; chunks='+appendCount+'; lastChunk='+lastChunkInfo+'; queued='+queue.length);
 });
 video.addEventListener('playing',()=>{say('');sound.style.display='none';});
 video.addEventListener('waiting',()=>{if(!sourceBuffer)say('Ожидание видеопотока…');});
 window.startIvideonStream=start;
 window.stopIvideonStream=()=>{
   stopped=true;session++;
   const ws=socket, ms=mediaSource, url=objectUrl;
   socket=null;mediaSource=null;sourceBuffer=null;queue=[];history=[];codecs=[];sourceOpen=false;objectUrl=null;initSegment=null;initQueued=false;fragmentTrackId=null;fragmentTrackId=null;trackFixInfo='не проверено';
