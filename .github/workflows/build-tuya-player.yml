name: Build Tuya Camera Player APK

on:
  push:
    branches: [ main ]
    paths:
      - "tuya-player/**"
      - "settings.gradle.kts"
      - ".github/workflows/build-tuya-player.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Tuya Player APK
        run: gradle :tuya-player:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuya-player-debug
          path: tuya-player/build/outputs/apk/debug/tuya-player-debug.apk
          if-no-files-found: error
