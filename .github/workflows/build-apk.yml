name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Diagnose Ivideon API authentication and endpoints
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ivideon-probe]')
        env:
          IVIDEON_API_KEY: ${{ secrets.IVIDEON_API_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext -layout "Ivideon API Documentation.pdf" /tmp/ivideon-api.txt
          echo "=== DOCUMENTED CAMERA/LIVE PREVIEW ENDPOINTS ==="
          grep -in -C 7 -E 'live_preview|/cameras/\\{Camera.id\\}|Camera.*op=FIND' /tmp/ivideon-api.txt | head -240 || true
          echo "=== END DOCUMENTATION EXCERPTS ==="
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request

          KEY = os.environ.get("IVIDEON_API_KEY", "")
          CAMERA = "100-y4iXBgzCDn0C8Jv08JcXDr:0"
          BASE = "https://openapi-alpha-eu01.ivideon.com"
          if not KEY:
              print("DIAG: IVIDEON_API_KEY missing; skipping API probes")
              raise SystemExit(0)

          def safe_body(raw, secrets):
              s = raw.decode("utf-8", "replace") if isinstance(raw, bytes) else str(raw)
              for secret in secrets:
                  if secret:
                      s = s.replace(secret, "[REDACTED]")
              s = re.sub(r'(?i)("(?:access_token|refresh_token|token)"\s*:\s*")[^"]*(")', r'\1[REDACTED]\2', s)
              s = re.sub(r'"id"\s*:\s*"xtok-[^"]+"', '"id":"[REDACTED]"', s)
              return s[:450].replace("\n", " ")

          def call(label, url, method, token, query_token=False):
              headers = {"Accept": "application/json"}
              if token and not query_token:
                  headers["Authorization"] = "Bearer " + token
              data = None
              if method == "POST":
                  headers["Content-Type"] = "application/json"
                  data = json.dumps({"fps": 2, "q": 1}).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=18) as r:
                      raw = r.read(1800)
                      status, ctype = r.status, r.headers.get("Content-Type", "")
              except urllib.error.HTTPError as e:
                  raw = e.read(1800)
                  status, ctype = e.code, e.headers.get("Content-Type", "")
              except Exception as e:
                  print(f"{label}: NETWORK {type(e).__name__}: {str(e)[:160]}")
                  return None
              body = safe_body(raw, [KEY, token])
              print(f"{label}: HTTP {status}; {ctype}; body={body}")
              try:
                  return json.loads(raw.decode("utf-8"))
              except Exception:
                  return None

          find = call("FIND", BASE + "/api_keys?op=FIND", "POST", KEY)
          key_id = None
          try:
              key_id = next(x["id"] for x in find["result"]["items"] if x.get("id"))
          except Exception:
              pass
          clone = None
          if key_id:
              clone = call("CLONE", BASE + "/api_keys/" + urllib.parse.quote(key_id, safe="") + "?op=CLONE", "POST", KEY)
          else:
              print("CLONE: skipped; APIKey id not found")

          clone_token = None
          hosts = [BASE]
          try:
              result = clone["result"]
              candidate = result.get("id", "")
              if isinstance(candidate, str) and candidate.startswith("xtok-"):
                  clone_token = candidate
                  print("::add-mask::" + clone_token)
              for name in ("api5_host", "api_host", "api4_host"):
                  host = result.get(name)
                  if host:
                      if not host.startswith("http"):
                          host = "https://" + host
                      if host.rstrip("/") not in hosts:
                          hosts.append(host.rstrip("/"))
          except Exception:
              pass

          camera_path = urllib.parse.quote(CAMERA, safe="")
          tokens = [("api-key", KEY)]
          if clone_token:
              tokens.append(("clone-token", clone_token))
          # Check canonical camera metadata and test the camera id with its colon left unescaped.
          for host in (BASE, "https://openapi-alpha.ivideon.com"):
              find_cameras = call("CAMERAS FIND " + host, host + "/cameras?op=FIND", "POST", KEY)
              if find_cameras:
                  try:
                      items = find_cameras.get("result", {}).get("items", [])
                      matched = [x for x in items if x.get("id") == CAMERA]
                      if matched:
                          x = matched[0]
                          print("CAMERA META: " + json.dumps({k: x.get(k) for k in ("id","name","online","connected","mode","type","plan","img_url","owner_id")}, ensure_ascii=False)[:1600])
                      else:
                          print("CAMERA FIND: target id not present; item_count=" + str(len(items)))
                  except Exception as e:
                      print("CAMERA FIND parse: " + type(e).__name__)
              raw_snap = host + "/cameras/" + CAMERA + "/live_preview"
              for token_name, token in tokens:
                  qurl = raw_snap + "?op=GET&q=2&access_token=" + urllib.parse.quote(token, safe="")
                  call(f"{token_name} GET snapshot raw-colon query-token {host}", qurl, "GET", token, query_token=True)
                  call(f"{token_name} GET snapshot raw-colon bearer {host}", raw_snap + "?op=GET&q=2", "GET", token)

          # Public Ivideon examples use access_token in the query string for JPEG preview.
          for extra_host in ("https://openapi-alpha.ivideon.com",):
              if extra_host not in hosts:
                  hosts.append(extra_host)

          for host in hosts:
              for token_name, token in tokens:
                  snap = host + "/cameras/" + camera_path + "/live_preview"
                  qbase = snap + "?op=GET&q=2&access_token=" + urllib.parse.quote(token, safe="")
                  call(f"{token_name} GET snapshot query-token {host}", qbase, "GET", token, query_token=True)
                  call(f"{token_name} GET snapshot query-token no-op {host}", snap + "?q=2&access_token=" + urllib.parse.quote(token, safe=""), "GET", token, query_token=True)
                  call(f"{token_name} GET snapshot op=GET {host}", snap + "?op=GET", "GET", token)
                  call(f"{token_name} GET snapshot no-op {host}", snap, "GET", token)
                  call(f"{token_name} POST snapshot op=GET {host}", snap + "?op=GET", "POST", token)
                  stream = snap + "?op=STREAM"
                  call(f"{token_name} POST STREAM Bearer {host}", stream, "POST", token)
                  qurl = stream + "&access_token=" + urllib.parse.quote(token, safe="")
                  call(f"{token_name} POST STREAM query-token {host}", qurl, "POST", token, query_token=True)
          # Probe the continuous Ivideon WebSocket MP4 stream (not JPEG live_preview).
          import subprocess, sys
          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "--target", "/tmp/ivideon-wsdeps", "websocket-client"], check=True)
          sys.path.insert(0, "/tmp/ivideon-wsdeps")
          import websocket
          for host in ("https://openapi-alpha.ivideon.com", BASE):
              for token_name, token in tokens:
                  params = urllib.parse.urlencode({
                      "op": "GET",
                      "access_token": token,
                      "q": "2",
                      "video_codecs": "h264",
                      "audio_codecs": "aac,mp3,pcma,pcmu,none",
                      "format": "ws-fmp4",
                  })
                  endpoint = host + "/cameras/" + urllib.parse.quote(CAMERA, safe=":") + "/live_stream?" + params
                  try:
                      req = urllib.request.Request(endpoint, headers={"Accept": "application/json"})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                      stream_url = payload.get("result", {}).get("url", "")
                      print(f"LIVE_STREAM {token_name} {host}: HTTP 200 success={payload.get('success')} message={payload.get('message','')[:120]}")
                      if not payload.get("success") or not stream_url:
                          continue
                      parsed = urllib.parse.urlsplit(stream_url)
                      print(f"LIVE_STREAM URL: scheme={parsed.scheme} host={parsed.hostname} path={parsed.path}; query hidden")
                      try:
                          ws = websocket.create_connection(stream_url, timeout=15, suppress_origin=True)
                          got_init = False
                          got_fragment = False
                          for _ in range(12):
                              frame = ws.recv()
                              if isinstance(frame, bytes):
                                  print(f"LIVE_STREAM WS: binary frame bytes={len(frame)}")
                                  got_fragment = True
                                  break
                              try:
                                  msg = json.loads(frame)
                              except Exception:
                                  print("LIVE_STREAM WS: received non-JSON text frame")
                                  continue
                              kind = msg.get("type", "")
                              print(f"LIVE_STREAM WS: message={kind} codec={msg.get('codec_string','')[:80]}")
                              if kind == "stream-init":
                                  got_init = True
                              if kind == "fragment":
                                  binary = ws.recv()
                                  print(f"LIVE_STREAM WS: fragment bytes={len(binary) if isinstance(binary, bytes) else 'unexpected-text'}")
                                  got_fragment = isinstance(binary, bytes)
                                  break
                          print(f"LIVE_STREAM WS RESULT: init={got_init} media_fragment={got_fragment}")
                          ws.close()
                      except Exception as e:
                          print(f"LIVE_STREAM WS CONNECT: {type(e).__name__}: {str(e)[:180]}")
                  except urllib.error.HTTPError as e:
                      raw = e.read(1200)
                      print(f"LIVE_STREAM {token_name} {host}: HTTP {e.code}; body={safe_body(raw, [KEY, token])}")
                  except Exception as e:
                      print(f"LIVE_STREAM {token_name} {host}: {type(e).__name__}: {str(e)[:180]}")
          print("DIAG COMPLETE: credentials and token values are not printed.")
          PY
      - name: Build debug APK
        env:
          IVIDEON_API_KEY: ${{ secrets.IVIDEON_API_KEY }}
        run: |
          if [ -z "$IVIDEON_API_KEY" ]; then
            echo "GitHub Actions secret IVIDEON_API_KEY is empty or missing"
            exit 1
          fi
          gradle assembleDebug -PivideonApiKey="$IVIDEON_API_KEY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ivideon-camera-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
