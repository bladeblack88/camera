name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          IVIDEON_API_KEY: ${{ secrets.IVIDEON_API_KEY }}
        run: |
          if [ -z "$IVIDEON_API_KEY" ]; then
            echo "GitHub Actions secret IVIDEON_API_KEY is empty or missing"
            exit 1
          fi
          gradle assembleDebug -PivideonApiKey="$IVIDEON_API_KEY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ivideon-camera-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
